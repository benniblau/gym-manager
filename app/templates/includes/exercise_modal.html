<!-- Exercise target values modal - shared by workout and template edit pages -->
<div class="modal fade" id="exerciseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Exercise</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <h6 id="modal-exercise-name"></h6>
                <input type="hidden" id="modal-exercise-id">

                <div class="mb-3">
                    <label for="target-sets" class="form-label">Target Sets</label>
                    <input type="number" class="form-control" id="target-sets" min="1" max="99" inputmode="numeric" value="3">
                </div>

                <div class="mb-3">
                    <label for="target-reps" class="form-label">Target Reps</label>
                    <input type="number" class="form-control" id="target-reps" min="1" max="999" inputmode="numeric" value="10">
                </div>

                <div class="mb-3">
                    <label for="target-weight" class="form-label">Target Weight (kg)</label>
                    <input type="number" class="form-control" id="target-weight" step="0.5" min="0" inputmode="decimal">
                </div>

                <div class="mb-3">
                    <label for="target-duration" class="form-label">Target Duration (seconds)</label>
                    <input type="number" class="form-control" id="target-duration" min="0" inputmode="numeric" placeholder="e.g., 30 for 30 seconds">
                    <small class="form-text text-muted">For time-based exercises like stretches or planks</small>
                </div>

                <div class="mb-3">
                    <label for="exercise-notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="exercise-notes" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirm-add-exercise">Add Exercise</button>
            </div>
        </div>
    </div>
</div>
