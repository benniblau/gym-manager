<!-- Exercise target values modal - shared by workout and template edit pages -->
<div class="modal fade" id="exerciseModal" tabindex="-1" aria-labelledby="modal-exercise-name">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-exercise-name"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="exercise-target-form">
                <div class="modal-body">
                    <input type="hidden" id="modal-exercise-id">

                    <div class="row g-2">
                        <div class="col-6">
                            <label for="target-sets" class="form-label">Sets</label>
                            <input type="number" class="form-control form-control-lg" id="target-sets" min="1" max="99" inputmode="numeric">
                        </div>
                        <div class="col-6">
                            <label for="target-reps" class="form-label">Reps</label>
                            <input type="number" class="form-control form-control-lg" id="target-reps" min="1" max="999" inputmode="numeric">
                        </div>
                        <div class="col-6">
                            <label for="target-weight" class="form-label">Weight (kg)</label>
                            <input type="number" class="form-control form-control-lg" id="target-weight" step="0.5" min="0" inputmode="decimal">
                        </div>
                        <div class="col-6">
                            <label for="target-duration" class="form-label">Time (seconds)</label>
                            <input type="number" class="form-control form-control-lg" id="target-duration" min="0" inputmode="numeric">
                        </div>
                    </div>
                    <small class="form-text text-muted d-block mt-2">Leave a field empty if it doesn't apply, e.g. only time for a plank.</small>

                    <div class="mt-3">
                        <label for="exercise-notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="exercise-notes" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary btn-touch" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-touch" id="confirm-add-exercise">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
